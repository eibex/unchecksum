<!DOCTYPE html>
<style>
    html, body {
        height: 100%;
        width: 90%;
        margin: 0 auto;
    }

    .center {
        margin: 0 auto;
        width: 60%;
        padding: 10px;
    }

    #navigator {
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 100%;
    }

    #navigator th, #navigator td {
        border: 1px solid #ddd;
        padding: 8px;
    }

    #navigator th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #aa0404;
        color: white;
    }

    #navigator tr:nth-child(even) {
        background-color: #f2f2f2;
    }
</style>

<body>
    <div class="center">
        <form id="sources_selection" action="{{ url_for('select_sources') }}" method="POST">
            <div>
                <p><strong>Source 1:</strong> {{ sources.source_one }}</p>
                <p><strong>Source 2:</strong> {{ sources.source_two }}</p>
            </div>
            <div align="right"><input type="submit" value="Select sources"></div>
            <br>
                <table id="navigator">
                    <thead>
                        <tr>
                            <th>Type</th>
                            <th>Name</th>
                            <th>Date</th>
                            <th>Size</th>
                            <th>Source 1</th>
                            <th>Source 2</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td>{{ item.type }}</td>
                            {% if item.type == "directory" %}
                            <td><a href="{{ url_for('home', directory=item.path) }}">{{ item.name }}</a></td>
                            {% else %}
                            <td>{{ item.name }}</td>
                            {% endif %}
                            <td>{{ item.date }}</td>
                            <td>{{ item.size }}</td>
                            <td><input type="checkbox" name="source_one" value="{{ item.path }}"></td>
                            <td><input type="checkbox" name="source_two" value="{{ item.path }}"></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
        </form>
    </div>
</body>
