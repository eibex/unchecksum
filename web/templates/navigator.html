<!DOCTYPE html>
<style>
    .center {
        margin: auto;
        width: 60%;
        padding: 10px;
    }
    #navigator {
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 100%;
    }

    #navigator th, #navigator td {
        border: 1px solid #ddd;
        padding: 8px;
    }

    #navigator th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #aa0404;
        color: white;
    }

    #navigator tr:nth-child(even) {
        background-color: #f2f2f2;
    }
</style>

<div class="center">
    <table id="navigator">
        <tr>
            <th>Type</th>
            <th>Name</th>
            <th>Date</th>
            <th>Size</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item.type }}</td>
            {% if item.type == "directory" %}
            <td><a href="{{ url_for('home', directory=item.path) }}">{{ item.name }}</a></td>
            {% else %}
            <td>{{ item.name }}</td>
            {% endif %}
            <td>{{ item.date }}</td>
            <td>{{ item.size }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
